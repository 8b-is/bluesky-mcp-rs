[package]
name = "bluesky-mcp-rs"
version = "0.1.0"
edition = "2021"
description = "Bluesky + AT Protocol MCP server in Rust. Stateless. Fast. MCP 2026-07-28."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
